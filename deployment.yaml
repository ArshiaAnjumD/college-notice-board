apiVersion: apps/v1
kind: Deployment

metadata:
  name: college-notice-board

spec:
  replicas: 2

  selector:
    matchLabels:
      app: college-notice-board

  template:
    metadata:
      labels:
        app: college-notice-board

    spec:
      containers:
        - name: college-notice-board
          image: arshiaanjumd/college-notice-board:1.0
          ports:
            - containerPort: 80
---

apiVersion: v1
kind: Service

metadata:
  name: college-notice-board-service

spec:
  type: NodePort

  selector:
    app: college-notice-board

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080